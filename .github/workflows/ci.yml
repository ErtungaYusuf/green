name: tests

# Private repositories pay for Actions minutes, and GitHub bills macOS at 10x and
# Windows at 2x: the full matrix on every push and every tag cost ~780 minutes per
# release and used up the month's free minutes in two days. So:
#   - pushes to main (not tags, which point at the same commit) and pull requests run
#     Linux on every supported Python plus one Windows job, and skip changes to docs only;
#   - macOS runs once a week and on demand (Actions tab, "Run workflow");
#   - a newer push cancels the run still going for the same branch.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE", "contrib/**"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE", "contrib/**"]
  schedule:
    - cron: "17 3 * * 1"        # Mondays 03:17 UTC, macOS included
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: ubuntu-latest, python: "3.14"}
          - {os: windows-latest, python: "3.13"}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test (GPU tests skip themselves on runners without a GPU)
        run: python -m pytest -q

  macos:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q

  docker:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Build the image
        run: docker build -t green .
      - name: "Smoke test - wallet, genesis, a node that mines and answers"
        run: |
          mkdir -p ci-data && chmod 777 ci-data
          docker run --rm -v "$PWD/ci-data:/data" green wallet new --no-password
          docker run --rm -v "$PWD/ci-data:/data" green genesis --msg "ci"
          docker run -d --name node -p 8545:8545 -v "$PWD/ci-data:/data" green
          for i in $(seq 1 60); do
            if curl -fs http://127.0.0.1:8545/status | grep -q '"height"'; then break; fi; sleep 1
          done
          curl -fs http://127.0.0.1:8545/status
          curl -fs http://127.0.0.1:8545/supply | grep -q '"ok": true'
          docker logs node | tail -5
          docker rm -f node
